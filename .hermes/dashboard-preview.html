<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEC 實驗溫控</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e14;--sf:#111820;--bd:#1e2a36;--tx:#e0e6ed;--t2:#7a8a9a;--t3:#4a5568;--r:#ef4444;--b:#3b82f6;--g:#22c55e;--a:#eab308;--c:#14b8a6;--o:#f97316}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:18px clamp(16px,3vw,42px);max-width:1480px;margin:0 auto;min-height:100dvh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 16px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.hdr h1{font-size:clamp(1.05rem,1.5vw,1.3rem);font-weight:750;letter-spacing:-.02em}
.hdr h1 b{color:var(--c)}
.conn{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--t2);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.dot.err{background:var(--r);box-shadow:0 0 0 3px rgba(239,68,68,.12)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px 8px;text-align:center;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.card.cr::before{background:var(--r)}.card.cb::before{background:var(--b)}.card.cg::before{background:var(--o)}
.card .val{font-size:clamp(1.2rem,2.2vw,1.7rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.card .lbl{font-size:.62rem;color:var(--t2);margin-top:5px;letter-spacing:.04em}
.dashboard{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,.85fr);gap:14px;align-items:start}
.primary-grid{display:grid;grid-template-columns:1fr;gap:10px;align-items:start}
.chart-sec{min-height:0}.chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.chart-toolbar h2{margin:0}.chart-toolbar .act-row{margin:0;width:auto;flex-shrink:0}.chart-toolbar .act-btn{min-width:82px}
.desktop-charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.desktop-chart{min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px}.desktop-chart h3{font-size:.62rem;font-weight:750;color:var(--t2);margin:0 0 5px}.desktop-chart.nest h3{color:var(--r)}.desktop-chart.room h3{color:var(--b)}.desktop-chart.vent h3{color:var(--o)}
.desktop-chart canvas{width:100%;height:175px;display:block}.mobile-chart{display:none}.control-col{display:grid;gap:10px}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:0}
.sec h2{font-size:.68rem;color:var(--t2);font-weight:750;margin-bottom:10px;text-transform:uppercase;letter-spacing:.1em}
.cam-sec{height:auto}.cam-sec #camBody{min-height:0}
.system-sec .btn{margin-bottom:2px}
.control-col .sec{box-shadow:0 1px 0 rgba(255,255,255,.018)}
.btn{width:100%;padding:11px;border-radius:6px;border:none;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s}
.btn.on{background:var(--r);color:#fff}
.btn.off{background:var(--c);color:#000}
.btn:active{transform:scale(.98)}
.pills{display:flex;gap:5px;margin-top:8px}
.pill{flex:1;text-align:center;padding:6px 0;border-radius:6px;background:var(--bg);border:1px solid var(--bd);font-size:.7rem;font-weight:600;cursor:pointer;user-select:none;transition:all .15s}
.pill:active{transform:scale(.96)}
.pill.sys.act{border-color:var(--c);color:var(--c)}
.pill.cold{color:var(--t2)}.pill.cold.act{border-color:var(--b);color:var(--b)}
.pill.hot{color:var(--t2)}.pill.hot.act{border-color:var(--r);color:var(--r)}
.pill.ch-pill{color:var(--t3);font-size:.58rem}.pill.ch-pill.act{color:var(--tx);border-color:var(--c)}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fld label{font-size:.7rem;color:var(--t2);min-width:64px}
.fld input[type=range]{flex:1;height:3px;-webkit-appearance:none;appearance:none;background:var(--bd);border-radius:2px;outline:none}
.fld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--c);cursor:pointer}
.fld .rv{font-size:.85rem;font-weight:800;color:var(--c);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.fld input.rv{background:0 0;border:1px solid transparent;outline:none;padding:2px 4px;border-radius:4px;width:60px;font-family:inherit;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fld input.rv::-webkit-inner-spin-button,.fld input.rv::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fld input.rv:focus{border-color:var(--c);color:var(--tx)}
.info{font-size:.62rem;color:var(--t3);line-height:1.6;margin-top:4px}
.info b{color:var(--t2)}
.act-row{display:flex;gap:5px;margin-top:6px}
.act-btn{flex:1;padding:7px;border-radius:5px;border:1px solid var(--bd);background:0 0;color:var(--t2);cursor:pointer;font-size:.68rem;font-weight:600;transition:all .15s}
.act-btn:active{transform:scale(.95);background:rgba(20,184,166,.1);border-color:var(--c);color:var(--c)}
#chart{width:100%;height:210px;display:block}
.cam-wrap{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam-wrap img{width:100%;height:100%;display:block;object-fit:cover}
.cam-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:.7rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--c);color:#000;padding:7px 18px;border-radius:8px;font-size:.78rem;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){body{max-width:760px;padding:14px 16px}.dashboard,.primary-grid{grid-template-columns:1fr}.control-col{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.system-sec{grid-column:1/-1}.desktop-chart canvas{height:150px}}
@media(max-width:768px){body{padding:12px 14px}.hdr{padding-bottom:12px;margin-bottom:10px}.grid{gap:6px;margin-bottom:10px}.card{border-radius:8px;padding:10px 4px}.card .val{font-size:1.15rem}.card .lbl{font-size:.54rem}.dashboard,.primary-grid,.control-col{display:grid;grid-template-columns:1fr;gap:8px}.sec{border-radius:8px;padding:12px}.sec h2{font-size:.62rem;margin-bottom:8px}.desktop-charts{display:none}.mobile-chart{display:block}.chart-toolbar{align-items:flex-start;flex-direction:column;gap:8px}.chart-toolbar .act-row{width:100%}.chart-toolbar .act-btn{min-width:0}.mobile-chart #chart{height:150px}.btn{min-height:44px}.pill,.act-btn{min-height:40px}.fld{min-height:38px}.cam-wrap{border-radius:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hdr">
  <h1><b>TEC</b> 蟄眠實驗</h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="st">...</span></div>
</div>
<div class="grid">
  <div class="card cr"><div class="val" id="mNest">--</div><div class="lbl">巢穴</div></div>
  <div class="card cb"><div class="val" id="mRoom">--</div><div class="lbl">活動區</div></div>
  <div class="card cg"><div class="val" id="mVent">--</div><div class="lbl">出風口</div></div>
</div>
<div class="dashboard">
  <div class="primary-grid">
    <div class="sec chart-sec">
      <div class="chart-toolbar">
        <h2>溫度趨勢</h2>
        <div class="act-row">
          <button class="act-btn" onclick="exportCSV()">導出 CSV</button>
          <button class="act-btn" onclick="clearHist()">清除記錄</button>
        </div>
      </div>
      <div class="desktop-charts">
        <div class="desktop-chart nest"><h3>巢穴</h3><canvas id="chartNest"></canvas></div>
        <div class="desktop-chart room"><h3>活動區</h3><canvas id="chartRoom"></canvas></div>
        <div class="desktop-chart vent"><h3>出風口</h3><canvas id="chartVent"></canvas></div>
      </div>
      <div class="mobile-chart">
        <canvas id="chart"></canvas>
        <div class="pills" style="margin-top:2px;margin-bottom:4px">
          <div class="pill ch-pill act" onclick="setChart(0)">巢穴</div>
          <div class="pill ch-pill" onclick="setChart(1)">活動區</div>
          <div class="pill ch-pill" onclick="setChart(2)">出風口</div>
        </div>
      </div>
    </div>
    <div class="sec cam-sec" id="camSec">
  <h2>即時影像 <button class="act-btn" id="camToggle" onclick="toggleCam()" style="float:right;padding:2px 8px;font-size:.6rem">開啟</button></h2>
  <div id="camBody">
    <div class="cam-wrap">
      <img id="camStream" src="" alt="camera" style="display:none" onload="camOk()" onerror="camErr()">
      <div class="cam-off" id="camOff">攝像頭已關閉</div>
    </div>
    <div class="pills" style="margin-top:8px">
      <button class="act-btn" id="irBtn" onclick="toggleIR()">IR 補光</button>
      <button class="act-btn" id="ledBtn" onclick="toggleLED()">LED 白光</button>
    </div>
  </div>
</div>
  </div>
  <div class="control-col">
<div class="sec system-sec">
  <h2>系統控制</h2>
  <button class="btn off" id="sysBtn" onclick="toggleSys()">開啟系統</button>
  <div class="pills">
    <div class="pill sys" id="pSys">待機</div>
    <div class="pill cold" id="pCool" onclick="toggleCool()">製冷</div>
    <div class="pill hot" id="pHeat" onclick="toggleHeat()">加熱</div>
  </div>
  <div class="pills" style="margin-top:6px">
    <button class="act-btn" id="modeBtn" onclick="toggleMode()">切換手動模式</button>
  </div>
</div>
<div class="sec">
  <h2>實驗目標溫度</h2>
  <div class="fld">
    <label>目標溫度</label>
    <input type="range" min="10" max="40" step="0.1" value="28" id="tgt" oninput="setTGT(this.value)">
    <input type="number" class="rv" id="tgtV" value="28" step="0.1" min="10" max="40" onchange="setTGT(this.value)">
  </div>
  <div class="fld">
    <label>維持範圍</label>
    <input type="range" min="0.01" max="3" step="0.01" value="0.5" id="hyst" oninput="setHYST(this.value)">
    <input type="number" class="rv" id="hystV" value="0.5" step="0.01" min="0.01" max="3" onchange="setHYST(this.value)">
  </div>
  <div class="info">巢穴 ＞<span id="nct">28.5</span>°C 製冷 | ＜<span id="nht">27.5</span>°C 加熱 | 中間不動作</div>
</div>
<div class="sec">
  <h2>安全保護</h2>
  <div class="fld">
    <label>巢穴最低</label>
    <input type="range" min="0" max="20" step="0.5" value="5" id="smin" oninput="setSMin(this.value)">
    <span class="rv" id="sminV">5</span>
  </div>
  <div class="fld">
    <label>巢穴最高</label>
    <input type="range" min="20" max="50" step="0.5" value="35" id="smax" oninput="setSMax(this.value)">
    <span class="rv" id="smaxV">35</span>
  </div>
  <div class="fld">
    <label>出風口上限</label>
    <input type="range" min="40" max="80" step="1" value="50" id="vmax" oninput="setVMax(this.value)">
    <span class="rv" id="vmaxV">50</span>
  </div>
  <div class="info">出風口超過上限 → 立即關閉系統（硬體保護）</div>
</div>
<div class="sec">
  <h2>風速控制</h2>
  <div class="fld">
    <label>手動風速</label>
    <input type="range" min="0" max="100" step="1" value="0" id="fanS" oninput="setFanM(this.value)">
    <span class="rv" id="fanV">0%</span>
  </div>
</div>
<div class="sec">
  <h2>更新頻率</h2>
  <div class="fld">
    <label>間隔秒數</label>
    <input type="range" min="1" max="10" step="1" value="2" id="pollS" oninput="setPoll(this.value)">
    <span class="rv" id="pollV">2s</span>
  </div>
</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var H=[],M=600,allData=[],ms=1000,pi=null,fm=false,ue=false,chartMode=0,ALLDATA_MAX=10000,camEnabled=false,controlTimers={};
var chartColors=[['#ef4444','rgba(239,68,68,'],['#3b82f6','rgba(59,130,246,'],['#f97316','rgba(249,115,22,']];
var chartLabels=['巢穴','活動區','出風口'];
var chartFields=['n','r','v'];
var cv=document.getElementById('chart'),cx=cv.getContext('2d');
var desktopCharts=[
  {cv:document.getElementById('chartNest'),mode:0},
  {cv:document.getElementById('chartRoom'),mode:1},
  {cv:document.getElementById('chartVent'),mode:2}
];
function sizeCanvas(canvas){var r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.round(r.height*devicePixelRatio));var ctx=canvas.getContext('2d');ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);return ctx;}
function rs(){cx=sizeCanvas(cv);desktopCharts.forEach(function(c){sizeCanvas(c.cv);});dC();}
window.addEventListener('resize',rs);
function drawChart(canvas,mode){
  var ctx=canvas.getContext('2d'),W=canvas.getBoundingClientRect().width,HH=canvas.getBoundingClientRect().height,pl=34,pr=7,pt=10,pb=18;
  var f=chartFields[mode],cl=chartColors[mode],lb=chartLabels[mode];
  ctx.clearRect(0,0,W,HH);
  if(H.length<2){ctx.fillStyle='#4a5568';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('等待 '+lb+' 資料...',W/2,HH/2);return;}
  var mn=1e9,mx=-1e9;H.forEach(function(r){var v=r[f];if(v!=null&&v<mn)mn=v;if(v!=null&&v>mx)mx=v;});
  if(mn>=mx){mn-=1;mx+=1;}
  var sp=mx-mn;if(sp<1){mn-=1;mx+=1;sp=2;}
  var pa=sp*.12;mn-=pa;mx+=pa;sp=mx-mn;
  var pw=W-pl-pr,ph=HH-pt-pb;
  ctx.strokeStyle='rgba(122,138,154,.08)';ctx.lineWidth=1;ctx.fillStyle='#4a5568';ctx.font='9px system-ui';ctx.textAlign='right';
  for(var i=0;i<=3;i++){var v=mx-(sp*i/3),y=pt+ph*i/3;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();ctx.fillText(v.toFixed(1),pl-3,y+3);}
  ctx.textAlign='center';ctx.font='8px system-ui';var st=pw/Math.max(1,H.length-1),xt=Math.max(1,Math.ceil(H.length/3));
  H.forEach(function(r,i){if(i%xt===0||i===H.length-1)ctx.fillText(r.ti,pl+st*i,HH-pb+12);});
  var gd=ctx.createLinearGradient(0,pt,0,HH-pb);gd.addColorStop(0,cl[1]+'.2)');gd.addColorStop(1,cl[1]+'0)');
  ctx.beginPath();var drawing=false;H.forEach(function(r,i){var x=pl+st*i,v=r[f];if(v==null){drawing=false;return;}var y=pt+(1-(v-mn)/sp)*ph;if(!drawing){ctx.moveTo(x,y);drawing=true;}else ctx.lineTo(x,y);});ctx.lineTo(pl+st*(H.length-1),HH-pb);ctx.lineTo(pl,HH-pb);ctx.closePath();ctx.fillStyle=gd;ctx.fill();
  ctx.beginPath();ctx.strokeStyle=cl[0];ctx.lineWidth=2;ctx.lineJoin='round';drawing=false;H.forEach(function(r,i){var x=pl+st*i,v=r[f];if(v==null){drawing=false;return;}var y=pt+(1-(v-mn)/sp)*ph;if(!drawing){ctx.moveTo(x,y);drawing=true;}else ctx.lineTo(x,y);});ctx.stroke();
  var la=H[H.length-1],laV=la[f];if(laV!=null){var lx=pl+st*(H.length-1),ly=pt+(1-(laV-mn)/sp)*ph;ctx.beginPath();ctx.arc(lx,ly,3.5,0,Math.PI*2);ctx.fillStyle=cl[0];ctx.fill();ctx.fillStyle=cl[0];ctx.font='bold 10px system-ui';ctx.textAlign='right';ctx.fillText(laV.toFixed(1)+'C',Math.max(pl+35,lx-7),ly-7);}
}
function dC(){drawChart(cv,chartMode);desktopCharts.forEach(function(c){drawChart(c.cv,c.mode);});}
rs();
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.className='toast show';setTimeout(function(){e.className='toast';},1500);}
function exportCSV(){
  if(!allData.length){toast('無資料');return;}
  var now=new Date(),ds=now.toLocaleString();
  function pad(n){return String(n).padStart(2,'0');}
  var fn='TEC_'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'_'+pad(now.getHours())+'-'+pad(now.getMinutes())+'-'+pad(now.getSeconds())+'.csv';
  var meta='# TEC 蟄眠實驗\n# 導出時間: '+ds+'\n';
  var c='﻿'+meta+'時間,巢穴,活動區,出風口,風扇(%),狀態\n'+allData.map(function(r){return r.ti+','+(r.n==null?'':r.n.toFixed(2))+','+(r.r==null?'':r.r.toFixed(2))+','+(r.v==null?'':r.v.toFixed(2))+','+Math.round(r.f*100/255)+','+(r.c?'製冷':r.h?'加熱':'維持');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=fn;a.click();
  toast('已導出 '+allData.length+' 筆');
}
function clearHist(){H=[];allData=[];rs();toast('已清除');}
var irOn=false,ledOn=false,camIP='';
function camOk(){var i=document.getElementById('camStream');i.style.display='';document.getElementById('camOff').style.display='none';}
function camErr(){document.getElementById('camStream').style.display='none';document.getElementById('camOff').style.display='flex';if(camIP){setTimeout(camPoll,5000);}}
function camPoll(){if(!camIP)return;document.getElementById('camStream').src='http://'+camIP+'/stream';}
if(camEnabled)camPoll();
function toggleIR(){irOn=!irOn;var u=camIP?'http://'+camIP+'/light?ir='+(irOn?1:0):'/light?ir='+(irOn?1:0);fetch(u).then(function(r){return r.json()}).then(function(d){irOn=!!d.ir;document.getElementById('irBtn').style.background=irOn?'#f59e0b':''}).catch(function(e){irOn=!irOn;toast('IR 控制失敗')});}
function toggleLED(){ledOn=!ledOn;var u=camIP?'http://'+camIP+'/light?led='+(ledOn?1:0):'/light?led='+(ledOn?1:0);fetch(u).then(function(r){return r.json()}).then(function(d){ledOn=!!d.led;document.getElementById('ledBtn').style.background=ledOn?'#f59e0b':''}).catch(function(e){ledOn=!ledOn;toast('LED 控制失敗')});}
async function doPoll(){
  try{
    var r=await fetch('/data'),d=await r.json();
    if(!d.ok){document.getElementById('st').textContent=d.message;document.getElementById('dot').className='dot err';return;}
    document.getElementById('dot').className='dot';
    document.getElementById('st').textContent=new Date().toLocaleTimeString();
    document.getElementById('mNest').textContent=d.nest==null?'---':d.nest.toFixed(2);
    document.getElementById('mRoom').textContent=d.room==null?'---':d.room.toFixed(2);
    document.getElementById('mVent').textContent=d.vent==null?'---':d.vent.toFixed(2);
    document.getElementById('sysBtn').className=d.systemOn?'btn on':'btn off';
    document.getElementById('sysBtn').textContent=d.systemOn?'停止系統':'開啟系統';
    var ps=d.systemOn?(d.cooling?'製冷中':d.heating?'加熱中':'維持中'):'待機';
    document.getElementById('pSys').textContent=ps;
    document.getElementById('pSys').className='pill sys'+(d.systemOn?' act':'');
    document.getElementById('pCool').className='pill cold'+(d.cooling?' act':'');
    document.getElementById('pHeat').className='pill hot'+(d.heating?' act':'');
    _cooling=d.cooling;_heating=d.heating;
    if(!ue){
      document.getElementById('tgt').value=d.targetTemp;
      document.getElementById('tgtV').value=d.targetTemp.toFixed(1);
      document.getElementById('hyst').value=d.hysteresis;
      document.getElementById('hystV').value=d.hysteresis.toFixed(2);
    }
    document.getElementById('nct').textContent=(d.targetTemp+d.hysteresis).toFixed(2);
    document.getElementById('nht').textContent=(d.targetTemp-d.hysteresis).toFixed(2);
    document.getElementById('smin').value=d.safeMin;
    document.getElementById('sminV').textContent=d.safeMin.toFixed(1);
    document.getElementById('smax').value=d.safeMax;
    document.getElementById('smaxV').textContent=d.safeMax.toFixed(1);
    document.getElementById('vmax').value=d.ventMax;
    document.getElementById('vmaxV').textContent=d.ventMax.toFixed(0);
    document.getElementById('modeBtn').textContent=d.manualMode?'切換自動模式':'切換手動模式';
    document.getElementById('modeBtn').style.background=d.manualMode?'rgba(239,68,68,.15)':'rgba(20,184,166,.15)';
    document.getElementById('modeBtn').style.color=d.manualMode?'var(--r)':'var(--c)';
    if(!fm){
      document.getElementById('fanV').textContent=Math.round(d.fanSpeed*100/255)+'%';
      document.getElementById('fanS').value=Math.round(d.fanSpeed*100/255);
    }
    camEnabled=d.camEnabled;if(d.camIP)camIP=d.camIP;
    // 串流時減少輪詢帶寬競爭
    var oldMs=ms;ms=camEnabled?5000:1000;if(oldMs!==ms)poll();
    document.getElementById('camToggle').textContent=camEnabled?'關閉':'開啟';
    if(!camEnabled){document.getElementById('camStream').style.display='none';document.getElementById('camOff').textContent='攝像頭已關閉';document.getElementById('camOff').style.display='flex';}
    H.push({n:d.nest,r:d.room,v:d.vent,f:d.fanSpeed,ti:new Date().toLocaleTimeString()});
    if(H.length>M)H.shift();
    allData.push({n:d.nest,r:d.room,v:d.vent,f:d.fanSpeed,c:d.cooling,h:d.heating,ti:new Date().toLocaleString()});
    if(allData.length>ALLDATA_MAX)allData.shift();
    dC();
  }catch(e){
    document.getElementById('st').textContent='更新失敗';
    document.getElementById('dot').className='dot err';
  }
}
function toggleSys(){fm=false;var b=document.getElementById('sysBtn'),on=b.classList.contains('off');b.className=on?'btn on':'btn off';b.textContent=on?'停止系統':'開啟系統';fetch('/control?system='+(on?1:0),{method:'POST'});doPoll();}
function toggleMode(){var m=document.getElementById('modeBtn').textContent.indexOf('手動')>=0?1:0;fetch('/control?manual='+m,{method:'POST'});doPoll();}
function queueControl(key,query){clearTimeout(controlTimers[key]);controlTimers[key]=setTimeout(function(){fetch('/control?'+query,{method:'POST'});},300);}
function setTGT(v){
  v=parseFloat(v);
  if(isNaN(v))return;
  v=Math.round(v*100)/100;
  document.getElementById('tgtV').value=v.toFixed(1);
  document.getElementById('tgt').value=v;
  queueControl('targetTemp','targetTemp='+v);
}
function setHYST(v){
  v=parseFloat(v);
  if(isNaN(v))return;
  v=Math.round(v*100)/100;
  document.getElementById('hystV').value=v.toFixed(2);
  document.getElementById('hyst').value=v;
  queueControl('hysteresis','hysteresis='+v);
}
function setSMin(v){document.getElementById('sminV').textContent=parseFloat(v).toFixed(1);queueControl('safeMin','safeMin='+v);}
function setSMax(v){document.getElementById('smaxV').textContent=parseFloat(v).toFixed(1);queueControl('safeMax','safeMax='+v);}
function setVMax(v){document.getElementById('vmaxV').textContent=parseFloat(v).toFixed(0);queueControl('ventMax','ventMax='+v);}
function setFanM(v){fm=true;document.getElementById('fanV').textContent=v+'%';fetch('/test?fan='+Math.round(v*255/100));setTimeout(function(){fm=false;},3000);}
async function tTest(type,val){
  try{var url=type==='cool'?'/test?cool='+val+'&heat=0&en=1':'/test?heat='+val+'&cool=0&en=1';await fetch(url);}catch(e){}
}
var _cooling=false,_heating=false;
function toggleCam(){
  camEnabled=!camEnabled;
  fetch('/camenable?on='+(camEnabled?1:0)).then(function(r){return r.json()}).then(function(d){camEnabled=d.camEnabled;if(d.camIP)camIP=d.camIP;
    document.getElementById('camToggle').textContent=camEnabled?'關閉':'開啟';
    if(camEnabled){camPoll();}else{document.getElementById('camStream').style.display='none';document.getElementById('camOff').textContent='攝像頭已關閉';document.getElementById('camOff').style.display='flex';}
  });
}
function toggleCool(){_cooling=!_cooling;if(_cooling){_heating=false;fetch('/control?manual=1',{method:'POST'});tTest('cool',200);}else{tTest('cool',0);}}
function toggleHeat(){_heating=!_heating;if(_heating){_cooling=false;fetch('/control?manual=1',{method:'POST'});tTest('heat',200);}else{tTest('heat',0);}}
function poll(){clearInterval(pi);pi=setInterval(doPoll,ms);}
function setPoll(v){ms=v*1000;document.getElementById('pollV').textContent=v+'s';poll();}
function setChart(v){
  chartMode=v;
  document.querySelectorAll('.ch-pill').forEach(function(e,i){e.className='pill ch-pill'+(i===v?' act':'');});
  rs();
}
document.querySelectorAll('input[type=range]').forEach(function(s){
  s.addEventListener('wheel',function(e){
    e.preventDefault();
    var step=parseFloat(s.step)||1;
    var v=parseFloat(s.value);
    if(e.deltaY<0)v+=step;else v-=step;
    v=Math.round(v/step)*step;
    v=Math.max(parseFloat(s.min),Math.min(parseFloat(s.max),v));
    s.value=v;
    s.dispatchEvent(new Event('input'));
  },{passive:false});
});
['tgtV','hystV'].forEach(function(id){
  var el=document.getElementById(id);
  el.addEventListener('focus',function(){ue=true;});
  el.addEventListener('blur',function(){ue=false;el.dispatchEvent(new Event('change'));});
});
poll();
</script>
