<style>
/* Layout: sticky bar with tabs on top, one centered 720px column of tap-to-reveal question cards; the first tab is a one-screen cheat sheet. */
:root{
  --bg:#f1f5f6; --surface:#ffffff; --ink:#12232b; --muted:#5a6d75; --line:#d5e0e3;
  --cold:#0b6f7c; --cold-soft:#dcf0f2; --warm:#b4400f; --warm-soft:#fbe7dc; --ok:#2f7d4f; --ok-soft:#e0f2e7;
  --hero-bg:#0a3a42; --hero-fg:#eaf5f6; --hero-mute:#9fc0c6; --h-warm:#ff9a63; --h-cold:#5cc4d2; --h-mid:#c9d6d9;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171b; --surface:#152329; --ink:#e4eef0; --muted:#8fa6ae; --line:#27393f;
  --cold:#5cc4d2; --cold-soft:#12363c; --warm:#ff9a63; --warm-soft:#3a2418; --ok:#6fcf93; --ok-soft:#173225; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171b; --surface:#152329; --ink:#e4eef0; --muted:#8fa6ae; --line:#27393f;
  --cold:#5cc4d2; --cold-soft:#12363c; --warm:#ff9a63; --warm-soft:#3a2418; --ok:#6fcf93; --ok-soft:#173225; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:1.35rem;margin:0;letter-spacing:.02em}
.prog{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cold);transition:width .3s}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.875rem;padding:5px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--cold);border-color:var(--cold);color:var(--bg);font-weight:700}
nav button .n{font-family:var(--f-mono);font-size:.72rem;opacity:.75;margin-left:5px}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

main{padding-top:20px}
.lead{color:var(--muted);font-size:.9rem;margin:0 0 16px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:28px 0 10px;text-wrap:balance}
h2:first-child{margin-top:0}
.say{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cold);border-radius:6px;padding:14px 16px;margin:0 0 10px}
.say small{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cold);margin-bottom:2px}
.say p{margin:0}
.nums{width:100%;border-collapse:collapse;font-size:.9rem}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.nums th,.nums td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.nums tr:last-child td{border-bottom:0}
.nums th{font-size:.75rem;color:var(--muted);font-weight:500}
.nums td.v{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--cold)}
.nums td.v.w{color:var(--warm)}
.risk{background:var(--warm-soft);border-radius:6px;padding:4px 16px;margin:0}
.risk li{margin:10px 0 10px 1.1em;padding-left:2px}
.risk b{color:var(--warm)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:0 0 10px}
.card.done{border-color:var(--ok)}
.qbtn{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:none;border:0;color:inherit;font:inherit;font-weight:500;padding:13px 14px;cursor:pointer}
.tag{flex:none;font-family:var(--f-mono);font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--cold-soft);color:var(--cold);margin-top:5px}
.tag.hard{background:var(--warm-soft);color:var(--warm)}
.qt{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);transition:transform .2s;margin-top:2px}
.qbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ans{padding:0 14px 14px 14px;border-top:1px dashed var(--line);margin:0 14px;padding:12px 0 6px;font-size:.95rem}
.ans p{margin:0 0 8px}
.ans ul{margin:0 0 8px;padding-left:1.2em}
.ans .careful{background:var(--warm-soft);color:var(--ink);border-radius:5px;padding:6px 10px;font-size:.88rem;margin:8px 0 0}
.ans .careful b{color:var(--warm)}
.ans .plain{border-left:3px solid var(--cold);padding-left:10px;color:var(--ink)}
.ans .plain b{color:var(--cold)}
.foot{display:flex;justify-content:flex-end;padding:0 14px 12px}
.mark{font:inherit;font-size:.8rem;border:1px solid var(--line);background:none;color:var(--muted);padding:3px 12px;border-radius:999px;cursor:pointer}
.mark[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.tools{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tools button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:6px;cursor:pointer}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;text-align:center}
.quiz .meta{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-bottom:12px}
.quiz .q{font-family:var(--f-display);font-weight:600;font-size:1.25rem;line-height:1.5;margin:0 0 18px;text-wrap:balance}
.quiz .ans{text-align:left;border:0;margin:0 0 16px;padding:14px;background:var(--bg);border-radius:6px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:1px solid var(--cold);background:var(--cold);color:var(--bg);padding:8px 20px;border-radius:6px;cursor:pointer}
.btn.ghost{background:none;color:var(--cold)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:32px 0}

/* v2 */
.wrap{max-width:760px}
header{border-bottom:0}
header::after{content:"";display:block;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cold),var(--warm))}
nav{padding-bottom:12px}
.qbtn{font-size:1.02rem;padding:15px 16px;line-height:1.55}
.card{transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--cold)}
.ans{font-size:1rem;line-height:1.75}
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:12px;padding:24px 20px 20px;margin:0 0 26px}
.hero .eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;color:var(--hero-mute);margin:0 0 8px}
.hero .big{font-family:var(--f-display);font-weight:900;font-size:clamp(1.55rem,6.5vw,2.1rem);line-height:1.3;margin:0 0 6px;text-wrap:balance}
.hero .big em{font-style:normal;color:var(--h-cold)}
.hero .big em.w{color:var(--h-warm)}
.hero .sub{color:var(--hero-mute);font-size:.9rem;margin:0 0 22px}
.thermo{position:relative;height:310px;margin:0 0 12px}
.thermo .tr{position:absolute;left:44px;top:0;bottom:0;width:10px;border-radius:5px;background:linear-gradient(to bottom,var(--h-warm),#8a9ca1 50%,var(--h-cold))}
.thermo .mk{position:absolute;left:40px;right:0;transform:translateY(-50%);display:flex;align-items:center;gap:14px}
.thermo .dot{flex:none;width:18px;height:18px;border-radius:50%;background:var(--hero-bg);border:3px solid var(--c)}
.thermo .lb{font-size:.92rem;line-height:1.4;min-width:0}
.thermo .lb b{font-family:var(--f-mono);font-size:1.02rem;color:var(--c);font-variant-numeric:tabular-nums;margin-right:6px}
.thermo .lb span{color:var(--hero-mute);font-size:.82rem;display:block}
.thermo .brace{position:absolute;left:24px;width:10px;border:2px solid var(--h-warm);border-right:0;border-radius:6px 0 0 6px}
.thermo .gap{position:absolute;left:0;width:18px;writing-mode:vertical-rl;text-align:center;font-size:.8rem;font-weight:700;color:var(--h-warm);transform:translateY(-50%)}
.hero .foot2{font-family:var(--f-mono);font-size:.7rem;color:var(--hero-mute);margin:0}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.twin div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.twin small{display:block;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.twin b{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--cold)}
.twin div.win{border-color:var(--cold);background:var(--cold-soft)}
kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:4px;opacity:.7}
.btn{padding:11px 22px;font-size:1rem}
.btn.bad{background:var(--warm);border-color:var(--warm)}
.quiz{padding:26px 20px}
.quiz .q{font-size:1.4rem}
.quiz .ans{font-size:1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
var CATS=[
 {id:"cheat",name:"速查"},
 {id:"use",name:"有什麼用"},
 {id:"concept",name:"概念題"},
 {id:"project",name:"項目題"},
 {id:"judge",name:"評委通用"},
 {id:"hard",name:"刁難題"},
 {id:"extra",name:"發散"},
 {id:"quiz",name:"抽題練習"}
];
var CARDS=[
/* ---- 有什麼用 ---- */
{c:"use",q:"你這個作品到底有什麼用？",a:"<p><b>說：</b> 這是面向未來微重力蟄眠實驗的脂尾袋鼩地面原型飼養籠，用 TEC 雙向溫控（降溫誘導蟄眠、加熱喚醒），帶溫濕度監測、紅外影像和分級安全保護，給人工蟄眠研究提供硬體平台。</p><p class=\"plain\"><b>白話：</b>太空人在太空久了肌肉會變細、骨頭會變脆；有些小動物會「睡一覺省能量」，睡的時候身體損失很小。要研究牠，先要有一個能讓牠冷下來睡、暖起來醒的籠子，我們做的是這個籠子在地面上的第一版。</p>"},
{c:"use",q:"它能幫到誰？誰會用？",a:"<p><b>說：</b> 直接用戶是空間生命科學和蟄眠生理的研究者；長遠受益的是長期載人深空任務的航天員，以及廢用性肌萎縮、骨質疏鬆的臨床研究。</p><p class=\"plain\"><b>白話：</b>現在是給做研究的科學家用；將來可能幫到太空人，也可能幫到長期臥床的病人。（注意：病人那條是研究方向，不是說這個籠子能治病。）</p>"},
{c:"use",q:"誰在乎小動物睡不睡覺？",a:"<p><b>說：</b> 研究價值在蟄眠期間的抗廢用性萎縮、抗骨質流失機制；文獻顯示冬眠動物的骨骼肌通過代謝重塑避免萎縮。</p><p class=\"plain\"><b>白話：</b>重點不是牠睡覺，是牠睡覺時「肌肉骨頭不容易壞」這個本事。</p>"},
{c:"use",q:"不去太空，在地球上能用嗎？",a:"<p><b>說：</b> 系統本身是通用的小型可控環境平台：閉環溫控、多參數監測、CSV 數據記錄、紅外影像、異常自動停機，可以用在小動物、昆蟲、植物的溫度生理實驗。</p><p class=\"plain\"><b>白話：</b>它就是一個會自己控溫度、記數據、拍夜視畫面、出事自己停的小箱子，學校實驗室也負擔得起。（邊界：降溫只到出風口約 15°C，箱內還沒那麼冷。）</p>"},
{c:"use",q:"現在就能用嗎？還差什麼？",a:"<p><b>說：</b> 目前只完成空箱測試；巢穴約 22°C，未達論文要求的艙內 15°C；安全機制有已知漏洞（#36、#37、手動模式 #8）；動物實驗需要倫理審批。</p><p class=\"plain\"><b>白話：</b>還不能放動物：箱子還不夠冷、有幾個安全問題要補、還要先拿到批准。我們先驗證的是「硬體能不能做到」。</p>"},
{c:"use",q:"這跟普通人的生活有什麼關係？",a:"<p><b>說：</b> 廢用性肌萎縮和骨質疏鬆在長期臥床者和老年人中很常見，和微重力下的生理變化相似；蟄眠的保護機制是潛在的轉化方向。</p><p class=\"plain\"><b>白話：</b>老人、長期躺床的人也會肌肉變細、骨頭變脆，跟太空人很像，弄懂動物怎麼避免，將來可能變成新的治療思路。</p>"},
{c:"use",q:"做這個花了多少錢？貴不貴？",a:"<p><b>（答辯前自己算總數填這裡）</b> <b>說：</b> 全部用商用現成器件 + 開源硬件 + 3D 列印，主要成本是 ESP32 主控、TEC、H 橋、感測器、攝影機和 PLA 耗材，總共約 ___ 元。</p><p class=\"plain\"><b>白話：</b>零件都是網上買得到的，比買一台商用動物恆溫箱便宜很多。</p>"},
{c:"use",q:"能不能做很多台、推廣？",a:"<p><b>說：</b> 可複製性好：器件都是現貨，結構件 3D 列印，固件和文檔都整理好了；擴展成多通道可以設對照組。簡介裡的六籠單元目前只是 CAD 設計。</p><p class=\"plain\"><b>白話：</b>照著我們的資料就能再做一台；做幾台一起用，就能一台當對照。</p>"},
{c:"use",q:"跟直接買現成的恆溫箱比，好在哪？",a:"<p><b>說：</b> 商用恆溫箱多用壓縮機製冷，精度高但體積大、成本高、不能定制；我們用 TEC，可雙向溫控、可按實驗改，還自帶遠程監測、紅外影像和安全停機。</p><p class=\"plain\"><b>白話：</b>現成的更準但大、貴、改不了；我們的小、便宜、能按這個實驗改。不比精度，比適合。</p>"},
{c:"use",q:"動物在裡面會不會痛苦？蟄眠有害嗎？",a:"<p><b>說：</b> 脂尾袋鼩是自發性每日蟄眠物種，蟄眠是正常生理行為；文獻記載甦醒時體溫回升 0.7–1.0°C/min，約 15 分鐘從約 15°C 回到 30–34°C，不造成長期損害。</p><p class=\"plain\"><b>白話：</b>牠在野外本來每天都會這樣睡，醒得也快，不傷身。我們目前沒放動物，以後放也要先過倫理審批。</p>"},
{c:"use",q:"為什麼不直接用人做實驗？",a:"<p><b>說：</b> 人類沒有自發蟄眠能力，而且受倫理限制，必須先在動物模型裡確定機制和安全參數。</p><p class=\"plain\"><b>白話：</b>人不會自己蟄眠，也不能拿人亂試，先在會蟄眠的動物身上弄清楚。</p>"},
{c:"use",q:"人真的能像動物那樣冬眠嗎？",a:"<p><b>說：</b> 人工誘導人類進入低代謝狀態仍在研究階段，還沒實現。</p><p class=\"plain\"><b>白話：</b>現在還不能，這正是科學家在研究的；我們只是幫他們做工具。</p>"},
{c:"use",q:"什麼叫「地面原型」？",a:"<p><b>說：</b> 在地面驗證核心功能（溫控、監測、安全）的工程樣機，沒有經過飛行鑒定（振動、失重、輻射、真空等測試）。</p><p class=\"plain\"><b>白話：</b>就是「上太空之前，先在地上做的試驗版」。</p>"},
{c:"use",q:"你們從這個項目學到什麼？",a:"<p><b>說：</b> ① 氣流熱負載：風量不是越大越好；② 結論要靠控制變量的對照實驗，我們兩次改結構都因變量沒控制住而無法歸因；③ 失效安全（fail-safe）設計：異常時設備要自動進入安全狀態。</p><p class=\"plain\"><b>白話：</b>直覺會騙人；要比較就只能改一樣東西；出事時機器要自己停。</p>"},
{c:"use",q:"你們怎麼分工？",a:"<p><b>（三位成員答辯前對好，各自能講自己那塊的細節）</b> 例如：誰負責接線和硬體、誰負責程式和網頁、誰負責實驗和數據、誰負責報告和 CAD。</p>"},
{c:"use",q:"為什麼對這個題目有興趣？",a:"<p><b>（用自己的真實經歷講一句，不要背範例）</b> 例如：看到太空人回地球要人扶著走的新聞，好奇有沒有辦法；後來查到小動物蟄眠能保護肌肉。</p>"},
/* ---- 概念題 ---- */
{c:"concept",q:"什麼是蟄眠（torpor）？和冬眠區別？",a:"<p><b>說：</b> 蟄眠是動物主動、可逆地降低代謝率和體溫的狀態。每日蟄眠持續數小時，冬眠以季節計、可持續數月；脂尾袋鼩能自發每日蟄眠。</p><p class=\"plain\"><b>白話：</b>像手機開省電模式；蟄眠是睡幾個鐘頭，冬眠是一睡幾個月。</p>"},
{c:"concept",q:"為什麼研究蟄眠和太空有關？",a:"<p><b>說：</b> 微重力下抗重力肌（如比目魚肌）發生廢用性萎縮，並伴隨骨質流失；文獻顯示冬眠動物骨骼肌通過代謝重塑避免廢用性萎縮。</p><p class=\"plain\"><b>白話：</b>沒有重力，肌肉骨頭不用出力就會變細變脆，像腿打石膏幾個月會變細；但冬眠動物躺幾個月肌肉卻不太萎縮。</p>"},
{c:"concept",q:"為什麼選脂尾袋鼩？",a:"<p><b>說：</b> 能自發每日蟄眠、不需季節誘導；成年 10–20 g；尾部儲脂可作非侵入的代謝指標；原生澳洲乾燥氣候，耐受資源受限環境。</p><p class=\"plain\"><b>白話：</b>牠天天都會自己蟄眠，個子小，看尾巴胖瘦就知道牠的能量狀況，不用抽血。</p>"},
{c:"concept",q:"TEC 是什麼？原理？",a:"<p><b>說：</b> TEC1-12703 半導體製冷片，基於帕爾貼效應：直流電流過 P/N 型半導體時，一面吸熱、一面放熱；<b>改變電流方向，冷熱面互換</b>。我們用 BTS7960 H 橋切換方向，所以同一片既能製冷也能加熱。</p><p class=\"plain\"><b>白話：</b>它是一個「熱量搬運工」，通電就把熱從一面搬到另一面；反過來通電就反過來搬。</p>"},
{c:"concept",q:"為什麼用 TEC 而不是壓縮機？",a:"<p><b>說：</b> TEC 是固態器件，沒有運動部件、沒有製冷劑、無振動、可雙向；缺點是能效比（COP）低，熱端要散掉的熱比較多。</p><p class=\"plain\"><b>白話：</b>冰箱的壓縮機又大又會震；TEC 很小很安靜，還能冷熱兩用，代價是比較費電。</p>"},
{c:"concept",q:"為什麼熱端要散熱？",a:"<p><b>說：</b> 熱端排熱量 = 冷端吸熱量 + 輸入電功率；熱端溫度降不下來，冷熱面溫差有限，冷端溫度就跟著上升。</p><p class=\"plain\"><b>白話：</b>跟冷氣一定要有室外機一樣，熱搬出來要有地方丟。</p>"},
{c:"concept",q:"銅片有什麼用？",a:"<p><b>說：</b> 0.3 mm 紫銅片作均熱片，利用銅的高導熱率把 TEC 熱面集中的熱量橫向擴散，降低擴散熱阻，讓整塊散熱器底面參與散熱。冷面約 16–17°C 降到約 5–6°C（手測，沒有存 CSV，要如實說）。</p><p class=\"plain\"><b>白話：</b>把一小團熱「攤平」到整塊散熱器上。</p>"},
{c:"concept",q:"bang-bang 控制是什麼？",a:"<p><b>說：</b> 開關式控制加死區：巢穴溫度高於「目標 + 死區」滿功率製冷，低於「目標 − 死區」滿功率加熱，區間內關閉。優點簡單可靠，缺點是溫度在死區內波動。</p><p class=\"plain\"><b>白話：</b>像冷氣「到溫度就停、熱了再開」。</p>"},
{c:"concept",q:"為什麼不用 PID？",a:"<p><b>說：</b> 07-23 上午試過 PI，調了兩個鐘頭：當時室溫 29–30°C、目標 28°C，溫差太小，PI 輸出一直偏低，13:07 改成開關式。正式 24→15°C 實驗溫差大，到時要換回 PI（步驟在 CONFIG_GUIDE §3.5）。</p><p class=\"plain\"><b>白話：</b>溫差太小時那套「按差距算功率」的方法使不上力，就先用最簡單的開關法。</p>"},
{c:"concept",q:"PWM 是什麼？",a:"<p><b>說：</b> 脈寬調變：以固定頻率高速開關，用占空比（開的時間比例）調平均功率；TEC 經 H 橋用 PWM 調功率。冷端風扇是 4 線 PWM 風扇：電源一直接著，ESP32 只給控制線送 25 kHz 信號，風扇內部按占空比調轉速，所以 52% 是控制信號占空比，不等於 52% 轉速。</p><p class=\"plain\"><b>白話：</b>像飛快地開關燈，開的時間長一點就亮一點。</p>"},
{c:"concept",q:"ESP32 是什麼？為什麼選它？",a:"<p><b>說：</b> 雙核、內建 WiFi 的低成本微控制器，同時跑控溫、Web 伺服器和 OLED，不需要另外的網關。</p><p class=\"plain\"><b>白話：</b>一塊很便宜、能上網的小電腦板，一塊就能管溫度又能開網頁。</p>"},
{c:"concept",q:"DS18B20 是什麼？",a:"<p><b>說：</b> 數位溫度感測器，用 OneWire 單總線，每顆有唯一的 64 位 ROM 地址，我們按地址分配角色，12 位解析度（0.0625°C）。3 顆：巢穴（控溫）、活動區（監測）、出風口（過熱保護）。</p><p class=\"plain\"><b>白話：</b>三根溫度計共用一條線，每根有自己的「身份證號」，所以分得清誰是誰。</p>"},
{c:"concept",q:"BME680 測什麼？",a:"<p><b>說：</b> 溫度、濕度、氣壓、氣體電阻。用溫濕度算露點做防結露警示；氣體只記錄原始電阻，不換算成 CO₂ 或空氣品質指數。</p><p class=\"plain\"><b>白話：</b>一個小晶片同時量冷熱、乾濕和氣壓，用來判斷箱子裡會不會「出水」。</p>"},
{c:"concept",q:"為什麼要紅外攝影機？",a:"<p><b>說：</b> 脂尾袋鼩夜間活動，用 940 nm 近紅外補光，人眼看不見，一般認為對夜行小動物干擾很小，不打亂晝夜節律。</p><p class=\"plain\"><b>白話：</b>像夜視監控，黑暗中也能看到動物，又不會開燈吵醒牠。</p>"},
{c:"concept",q:"什麼是露點、為什麼擔心結露？",a:"<p><b>說：</b> 露點是空氣在含水量不變下冷卻到飽和、開始凝結的溫度；我們用 BME680 溫濕度按 Magnus 公式計算，出風口 ≤ 露點 + 1°C 時警示。冷端鰭片比露點冷，必然凝露，水滴可能被吹向動物，所以做了警示和雙層網架空。</p><p class=\"plain\"><b>白話：</b>夏天冰水杯外面出水珠就是結露。</p>"},
{c:"concept",q:"為什麼要 3D 列印？",a:"<p><b>說：</b> PLA 熔融沉積列印，快速原型迭代、成本低；P1→P3 三輪靠它。</p><p class=\"plain\"><b>白話：</b>改設計不用開模，印一個新的就能試。</p>"},
{c:"concept",q:"什麼是 I²C？",a:"<p><b>說：</b> 兩線串列匯流排（SDA 數據線、SCL 時鐘線），每個設備有自己的地址；OLED 和 BME680 共用。</p><p class=\"plain\"><b>白話：</b>兩條線像一條共用電話線，每台設備有自己的號碼。</p>"},
{c:"concept",q:"看門狗（watchdog）是什麼？",a:"<p><b>說：</b>一個獨立倒數的計時器。主程序每跑一圈就把它重置一次（叫「餵狗」），程序卡住、超過 7 秒沒餵，它就強制讓 ESP32 重啟。我們用 ESP32 自帶的任務看門狗：<code>esp_task_wdt_init(7, true)</code>。</p><p><b>為什麼要：</b>程序卡死時 TEC 會停在最後狀態，如果剛好在全力製冷或加熱，箱子會一直冷下去或熱下去；有看門狗，最多 7 秒就重啟、重新控溫。接相機那幾天主循環被拖住，它真的觸發過重啟。</p><p class='plain'><b>白話：</b>像一個「每 7 秒要按一次的按鈕」，程序正常會一直按，死機按不到，它就自動幫你重開機。</p><p class='careful'><b>邊界</b>：只管「程序卡死」，管不了「程序沒卡但邏輯算錯」；重啟後自動恢復運行靠斷電恢復功能，還沒上機拔電驗證。</p>"},
/* ---- 項目題 ---- */
{c:"project",q:"為什麼選 TEC1-12703，不選 12706？",a:"<p>07-22 兩片都測了：同一個散熱器、同一套探頭，製冷前先把箱子加熱到 29–30°C 當統一起點。</p><ul><li>製冷約 10 分鐘：12703 降 4.6°C（0.449 °C/min），12706 降 4.2°C（0.414 °C/min）</li><li>加熱約 5 分鐘：12703 升 7.0°C（1.484 °C/min），12706 升 6.7°C（1.305 °C/min）</li><li>功耗：12703 約 36 W，12706 約 72 W（12 V × 額定電流估算，沒實測）</li></ul><p><b>關鍵一句</b>：12706 功率翻倍，製冷反而略差，說明當時卡住的是熱端散熱，不是片子不夠大。</p><p class='plain'><b>白話：</b>大的那片多用一倍電，但熱散不出去，反而沒比小的冷。</p><p class='careful'><b>注意</b>：這組是舊的比例控溫固件，每種只測一次。</p>"},
{c:"project",q:"你們最大的發現是什麼？",a:"<p><b>冷端風扇降速優於全速。</b>08-01 同一次實驗裡：風扇 100% 時出風口停在 18.6°C 下不去；手動降到 52% 後，23 分鐘內降到 14.87°C。</p><p><b>說：</b>全速時氣流熱負載大，大量室溫空氣流過冷端，TEC 的製冷量被拿去冷卻新進空氣；降速後空氣在鰭片間停留更久、換熱更充分。</p><p class='plain'><b>白話：</b>風吹太快，空氣「來不及被冷到」就走了，像手在冰塊上快速划過不覺得冰，放著才冰。</p><p class='careful'><b>注意</b>：這是聽了建議才試的，被問「誰想到的」要如實說。</p>"},
{c:"project",q:"50% 只到 17.3°C，52% 卻到 14.9°C，差 2% 怎麼差這麼多？",a:"<p>不是 2% 造成的。兩檔的條件不一樣：</p><ul><li>50% 只跑了 4 分 44 秒，到 17.33°C 時還在以約 0.28°C/min 往下降，沒到穩定</li><li>52% 跑了約 23 分鐘，而且開始時箱子已經被前面預冷過</li></ul><p>所以數據只能說明「降速比全速好」，不能說 52% 比 50% 好，更不能說 52% 是最優。要回答這個，要做檔位掃描：30/40/50/60/70/80/100% 每檔穩定 15 分鐘。</p>"},
{c:"project",q:"08-01 那條曲線中間，溫度為什麼又升上去了？",a:"<p>11:59 到 12:02 那段。當時中途停過一次系統，風扇回到 100%，三個探頭一起往上升，出風口從 17.33 升到 21.81°C。12:06 重新手動設 52%，之後一路降到 14.87°C。</p><p class='careful'><b>注意</b>：這段是操作造成的，不是設備自己失控；分析時要排除這一段。</p>"},
{c:"project",q:"這個設備現在的自動模式是怎麼工作的？",a:"<p><b>說：</b>開關式控溫，看的是巢穴溫度。高於「目標 + 0.5°C」就全力製冷、風扇全速；低於「目標 − 0.5°C」就全力加熱、風扇全速；在範圍內就關 TEC，風扇再轉 10 秒（約 78%）後停。大約每 4 秒判斷一次。所有安全保護也只在自動模式下生效。</p><p class='plain'><b>白話：</b>像冷氣「到溫度就停、熱了再開」，只是它太冷了還會自己加熱。</p><p class='careful'><b>注意</b>：箱子現在巢穴最冷約 22°C，目標設 15°C 的話它會一直製冷，到不了「停」那一步。</p>"},
{c:"project",q:"既然 52% 更冷，為什麼自動模式的風扇還是 100%？",a:"<p><b>說：</b>程式裡自動製冷、加熱時寫的是 <code>setFan(255)</code>，也就是全速。早期（07-22 比例控溫、07-23 上午 PI 版）風扇是跟著 TEC 功率變速的，功率越大風扇越快；07-23 改成開關式後，製冷加熱時就固定全速。08-01 才發現降速反而更冷，這個結論還沒寫回自動控制，現在要靠網頁滑條手動設 52%。</p><p><b>為什麼沒直接改成 52%</b>：52% 沒被證明是最優，先做檔位掃描再改才有根據。09-10 收尾時也決定不再改控溫代碼。</p><p class='plain'><b>白話：</b>實驗是手動把風扇調慢才那麼冷的，自動模式還沒學會這一招。</p><p class='careful'><b>注意</b>：演示時拖滑條沒問題（TEC 照樣自動、保護照常），但不要按「製冷/加熱」按鈕，那是沒有保護的手動模式。</p>"},
{c:"project",q:"出風口到了 15°C，算不算達到目標？",a:"<p>不算。論文要的 15°C 是<b>艙內環境</b>溫度。出風口是箱子裡最冷的一點，14.87°C；動物住的巢穴在對角最遠端，同一時刻是 22.19°C，差約 7°C。</p><p class='plain'><b>白話：</b>出冷氣的地方夠冷了，但冷氣送到動物那裡已經變暖了。</p>"},
{c:"project",q:"巢穴比出風口熱 7°C，冷量丟在哪裡？",a:"<p>兩個猜測，都沒證實也沒排除：</p><ul><li>箱體漏熱：PLA 壁只有 2–3 mm，冷氣繞到對角已被外面的熱加熱</li><li>冷端換熱不足：冷端換熱面只有約 16 cm²，冷面手測已經 5–6°C，冷量卻傳不太到空氣裡</li></ul><p>試過兩次：約 08-22 貼 20 mm XPS 保溫（查漏熱），08-29 在冷端夾鋁板（查換熱）。但兩次條件都沒控制好，說明不了問題。</p>"},
{c:"project",q:"貼了 XPS 保溫板之後，巢穴溫度有改善嗎？",a:"<p><b>沒有能說明問題的數據。</b>08-26 那次測試巢穴 38 分鐘從 26.10 升到 26.50°C，看起來沒用，但同時有三個條件變了：</p><ul><li>風扇 100%，不是 52%</li><li>室溫 27–28°C，比 08-01 高約 3°C</li><li>探頭接觸不良，讀到過 85°C 假讀數，還誤急停一次</li></ul><p>所以不能說 XPS 沒用。正確做法：同樣 52%、記下室溫，有 XPS 和沒 XPS 各測一次。</p><p class='careful'><b>注意</b>：巢穴 22°C 是沒裝 XPS 時測的；現在這台（有 XPS）沒在 52% 下測過。答辯前補測了就報新數字。</p>"},
{c:"project",q:"TEC 冷面 5–6°C 是怎麼量出來的？",a:"<p>是手測的，加銅片之後量的，當時沒存數據，沒有 CSV。08-27 又手測過一次：熱面約 28°C、冷面約 5–6°C。</p><p class='careful'><b>注意</b>：要主動說是手測。被問「有沒有記錄」就說沒有，這是我們數據的弱點。</p>"},
{c:"project",q:"為什麼試了 8.5 V 降壓，最後不用？",a:"<p>07-23 測的：12703 接 8.5 V 製冷 10 分半只降 3.62°C（12 V 時 4.6°C），出風口最低 26.13°C（12 V 時 25.4°C）。按速率算製冷慢了約 24%。省下的電換不回製冷的損失，所以保留 12 V。</p><p>一個有意思的副產品：8.5 V 時加熱速率 0.948°C/min，剛好落在動物自然甦醒的 0.7–1.0°C/min，以後想模擬自然復溫可以當一檔用。</p>"},
{c:"project",q:"熱端是怎麼散熱的？",a:"<p>TEC 熱面 → 0.3 mm 紫銅片（兩面塗散熱膏）→ 箱外鋁鰭片散熱器 → 7 cm、5500 RPM 風扇一直全速吹。</p><p>早期試過四熱管塔式 CPU 散熱器，體積太大、噪音大，放棄了。</p><p class='careful'><b>注意</b>：作品簡介寫的是「塔式熱管散熱器」，那是舊方案，實物不是。被問就照實說已經換掉。</p>"},
{c:"project",q:"冷凝水最後去哪了？",a:"<p><b>沒有做集水盤或排水</b>（09-10 決定，時間不夠）。目前的處理是：</p><ul><li>箱底雙層 304 不鏽鋼網（8 目），把動物墊高，不碰積水</li><li>鋪了隔水墊</li><li>BME680 算露點，出風口 ≤ 露點 + 1°C 時網頁出橫幅、OLED 顯示 DEW 提醒</li></ul><p class='careful'><b>注意</b>：水滴還是可能被風吹到動物身上，這是已知問題（LIMITATIONS #25）。</p>"},
{c:"project",q:"為什麼結露只提醒，不自動降低製冷？",a:"<p>出風口測的是氣流溫度，冷端鰭片表面其實比它更冷，所以這個信號本身就偏晚。拿一個偏晚的信號去降功率，風險比好處大。等冷端表面另加了探頭，再考慮聯動。</p>"},
{c:"project",q:"三個溫度探頭分別在哪？為什麼這樣放？",a:"<ul><li><b>巢穴</b>：箱內對角最遠端，動物住的地方，也是最難冷到的地方，所以用它來控溫</li><li><b>活動區</b>：只監測，看箱內環境</li><li><b>出風口</b>：冷風出來的地方，做過熱保護（≥ 50°C 急停）</li></ul><p>三顆按各自的 ROM 地址分角色，不取平均；取平均會把最熱和最冷混在一起，沒有意義。</p><p class='careful'><b>注意</b>：指著實物說具體位置，答辯前自己看一眼探頭在哪。</p>"},
{c:"project",q:"OLED 屏幕上顯示什麼？網頁多久更新一次？",a:"<p>OLED：巢穴、活動區、出風口三個溫度（斷線顯示 ---），當前狀態（製冷/加熱/待機/關），目標溫度，風扇百分比，自動或手動；有結露風險時顯示 DEW。</p><p>網頁每 1 秒向 ESP32 要一次數據（開相機時 5 秒），溫度約 4 秒更新一次。數據可以匯出成 CSV。</p>"},
{c:"project",q:"停電再來電，設備會怎樣？",a:"<p>目標溫度等參數存在 ESP32 的 EEPROM 裡，來電後讀回來；如果停電前系統是開著的，會自動重新開始控溫。但如果之前是<b>緊急停機</b>，就不會自己重開，要人去檢查。</p><p class='plain'><b>白話：</b>停電不該讓實驗斷掉；可是出過事的，不能讓它自己又跑起來。</p><p class='careful'><b>注意</b>：10-04 才加的，拔電試過才說「驗證過」，沒試就說還沒上機驗證。</p>"},
{c:"project",q:"出事了怎麼辦？有哪些安全保護？",a:"<ul><li>任一探頭連續 3 次讀不到（約 12 秒）→ 緊急停機</li><li>出風口 ≥ 50°C → 整機停機；40°C 起逐步降功率</li><li>巢穴低於 5°C 或高於 35°C → 只關 TEC，風扇繼續換氣</li><li>看門狗：程式卡住超過 7 秒自動重啟</li><li>參數斷電保存，來電自動恢復</li></ul><p class='careful'><b>注意</b>：手動模式（網頁製冷/加熱按鈕）下這些保護全部不生效。</p>"},
{c:"project",q:"你們的保護可靠嗎？有沒有出過問題？",a:"<p>主動講已知漏洞：</p><ul><li>DS18B20 剛上電會回傳 85.0°C，程式只剔除大於 85 的，08-26 因此誤讀出風口 56°C、誤急停一次（#37）</li><li>本來就缺一顆探頭、之後整條線又全掉時，不會急停（#36）</li><li>手動模式全部保護不生效（#8），08-31 那次就是手動模式跑的</li></ul><p>演示前用 <code>/diag</code> 確認 3 顆探頭在線、晃一晃線看有沒有跳 85.00；動物實驗前必須改代碼。</p>"},
{c:"project",q:"兩塊 ESP32 怎麼分工？相機壞了會怎樣？",a:"<p>主控 ESP32 管溫控、網頁、OLED；另一塊 ESP32-S3 相機板只管影像和紅外燈。兩塊只通過 WiFi 聯繫，瀏覽器直接連相機看串流。相機壞了不影響控溫。</p><p>一開始讓主控代理相機畫面，結果主控的程式被拖住、按鈕沒反應，還觸發過看門狗重啟，所以才拆開。</p>"},
{c:"project",q:"怎麼證明你的程式是對的？",a:"<p>兩種：桌面端單元測試 41 項全部通過（控溫判斷、安全保護、EEPROM、防結露等）；另外 18 份實測 CSV。</p><p class='careful'><b>注意</b>：單元測試是把邏輯複製出來在電腦上測（鏡像測試），不是直接測燒進板子的程式，也測不了硬體。</p>"},
{c:"project",q:"製冷和加熱方向反過來是怎麼回事？",a:"<p>11-02 重新燒錄後，按網頁「製冷」實際在加熱。原因應是之前拆裝時動過線。這次不動線，在程式裡把兩個 PWM 腳對調（製冷 GPIO25、加熱 GPIO26），重新燒錄後上機確認方向正常。</p><p>教訓：改程式和改接線只能二選一，不然會一直反。</p>"},
{c:"project",q:"箱子有多大？",a:"<p>外尺寸約 20 × 24 × 16 cm，3D 列印 PLA 外殼；裡面貼 20 mm XPS 保溫板，內部約 16 × 20 × 12 cm，約 3.8 升。</p>"},
/* ---- 評委通用 ---- */
{c:"judge",q:"你說是因為太空人肌肉萎縮，那為什麼做的是籠子，不是研究肌肉？",a:"<p>中學生沒辦法做太空實驗或動物實驗。但要研究蟄眠，第一步一定是一個能穩定控溫、能監測的實驗載體；沒有它，後面的研究都做不了。所以我們選了能力範圍內、又是整個研究必需的那一環。</p>"},
{c:"judge",q:"哪些是你們自己做的？哪些是別人幫的？",a:"<p>自己做的：接線、全部程式和網頁、3D 列印箱體、所有實驗和數據分析。</p><p>別人幫的：指導老師王恒老師給方向和要求；加銅片和風扇降速是聽了建議才去試的；查新和文獻。</p><p class='careful'><b>注意</b>：三個人答辯前對好分工，每人能指著實物講自己那塊。</p>"},
{c:"judge",q:"整個項目花時間最多的是哪一部分？",a:"<p>接相機。07-24 到 07-28 幾乎都耗在上面，07-27 一天 37 次提交。串流卡死、紅外燈沒反應，換了好幾種寫法，最後發現是開發板型號選錯了：選的是通用 S3 板型，不認板上的 8 MB PSRAM，畫面緩衝放不下就崩。換成正確的 dfrobot_dfr1154 板型才解決。</p><p>教訓：遇到怪問題先查最基本的設定。</p>"},
{c:"judge",q:"你們遇到最難的問題是什麼？怎麼解決的？",a:"<p>箱內降不到 15°C。先判斷熱端是瓶頸，加了銅片，出風口從 24–26°C 降到 18.6°C；再發現風扇太快，降到 52%，出風口到 14.87°C；但巢穴還是 22°C。試了 XPS 和鋁板都沒拿到能說明問題的數據，最後和老師討論，09-03 決定先停在這裡，如實寫進報告，時間轉去做安全和監測。</p><p class='careful'><b>注意</b>：這題可以換成相機那件事講，選一個自己最熟的。</p>"},
{c:"judge",q:"如果重做一次，你第一件會改什麼？",a:"<ul><li>一開始就做對照實驗：每次只改一樣東西、記下室溫。我們 XPS 和鋁板兩次都因為同時改了好幾樣，結論說不清</li><li>冷端表面一開始就裝探頭，不靠手測</li><li>接相機時先確認板型設定，可以省好幾天</li></ul>"},
{c:"judge",q:"下一步最先做什麼？為什麼是它？",a:"<p>同風速對照實驗：風扇都設 52%、記下室溫，有 XPS 和沒 XPS 各測一次。因為「7°C 丟在哪」是現在最大的問題，不先搞清楚，後面改什麼都是猜。</p><p>之後：巢穴局部冷區（用 XPS 把巢穴隔成約 1/6 體積的小空間直接送冷風）、風扇檔位掃描、把降速寫進自動模式、補安全漏洞、換回 PI 控溫，最後才是倫理批准後的動物預實驗。</p>"},
{c:"judge",q:"如果風扇降速沒有讓溫度變低，你會怎麼判斷問題在哪？",a:"<p>那就說明冷端換熱不是瓶頸，問題在熱端：熱面散不掉，冷面也降不下來。我們 07-22 已經見過這種情況：12706 功率翻倍反而不更冷，就是熱端卡住。下一步會量熱面溫度、加大散熱器或風扇。</p>"},
{c:"judge",q:"為什麼用網頁看數據，不做手機 App？",a:"<p>ESP32 本身就能開網頁伺服器，手機、電腦打開瀏覽器就能看，不用安裝、不分 iPhone 還是 Android。老師 08-01 也要求電腦上要有一個穩定的儀表板。</p>"},
{c:"judge",q:"你們最大的不足是哪一個？",a:"<p>巢穴只到約 22°C，離論文要的 15°C 差 7°C，而且還找不到原因。其他不足：沒有動物實驗、只有一台沒有對照組、手動模式沒有保護、有幾個安全漏洞沒補。</p><p class='careful'><b>注意</b>：先說最大的那一個，再列其他；誠實比硬撐加分。</p>"},
{c:"judge",q:"你們的實驗是怎麼做的？一次測試的步驟是什麼？",a:"<p>以 TEC 選型為例：把箱子先加熱到 29–30°C 當統一起點 → 同一個散熱器、同一套探頭 → 一片製冷約 10 分鐘、加熱約 5 分鐘 → 網頁匯出 CSV → 用時間戳算升降溫速率。換另一片重複一次。</p><p class='careful'><b>注意</b>：每種只測了一次，重複性有限。</p>"},
/* ---- 刁難題 ---- */
{c:"hard",q:"沒有動物實驗，憑什麼說它能誘導蟄眠？",a:"<p>我們不聲稱能誘導。目標溫度來自文獻：環境低於 18°C 時脂尾袋鼩蟄眠傾向顯著增加，論文流程是 24°C 降到 15°C。本項目驗證的是硬體能不能穩定提供這個環境；動物實驗要倫理批准，是下一階段。</p>"},
{c:"hard",q:"太空裡的動物飼養箱不是本來就能調溫度嗎？你們有什麼不同？",a:"<p><b>說：</b>對，現有的在軌飼養設備本來就有溫控。日本 JAXA 的小鼠飼養單元放在 CBEF 設施裡，可控溫 15–40°C、控濕、控 CO₂；NASA 的囓齒類飼養艙也連續監測溫濕度。但它們調溫是為了把動物維持在<b>常溫、舒適</b>的範圍。</p><p><b>不同的地方</b>：專門為了<b>誘導蟄眠</b>、先降溫再加熱喚醒的飼養設備，目前還在概念階段。NASA 資助的 STASH 項目計劃在空間站上做一個能降到約 4°C 的冬眠實驗室，NASA 的介紹裡說研究囓齒類蟄眠所需的太空設施目前還不存在。我們做的是這個方向上一個低成本的地面原型。</p><p class='plain'><b>白話：</b>太空的動物籠子會開「冷氣」讓動物住得舒服；我們的籠子是要故意把牠弄冷、讓牠睡過去，再把牠暖醒，這種籠子太空裡還沒有。</p><p class='careful'><b>注意</b>：不要說「太空飼養箱都不能調溫」或「我們是第一個」。也不要跟 STASH 比溫度：它目標 4°C，我們巢穴只到約 22°C，只說方向相同、我們是地面原型。</p>"},
{c:"hard",q:"箱內都沒到 15°C，這個原型算成功嗎？",a:"<p>部分成功。出風口 14.87°C 證明降溫能力夠；巢穴 22°C 說明冷量沒送到位。我們如實寫進報告，也提出了要怎麼查：同風速對照實驗分清是漏熱還是換熱不足。</p>"},
{c:"hard",q:"簡介說熱端用塔式熱管散熱器、有 HEPA 濾芯和活性炭，實物上在哪？",a:"<p>塔式散熱器是早期方案，體積大、噪音大已經換掉，現在是鋁鰭片散熱器加銅片。HEPA、活性炭、吸附墊是設計構想，樣機最後沒裝，實際裝的是定向氣流和雙層不鏽鋼網。簡介寫得不夠準確，以實物為準。</p>"},
{c:"hard",q:"簡介說「確認 52% 時最低」，可是你剛才說 52% 不一定最優？",a:"<p>簡介那句措辭過頭了。準確的說法是：52% 時測到出風口最低 14.87°C，但沒做檔位掃描，只能證明降速優於全速。</p>"},
{c:"hard",q:"風小了出風口更冷，但送進箱子的總冷量是不是反而少了？",a:"<p><b>說：</b>有可能。冷氣帶走的熱量大約是<b>風量 × 溫差</b>（溫差 = 進冷端的空氣溫度 − 出風口溫度）。風扇降速後每份空氣冷得更多，但風量也少了，總冷量不一定更多。</p><p><b>粗算</b>（進冷端空氣約 23°C）：</p><ul><li>風扇 100%：出風口 18.6°C，每份空氣冷約 4.4°C，風量 1 → 1 × 4.4 ≈ 4.4</li><li>風扇 52%：出風口 14.9°C，每份空氣冷約 8°C，假設風量剩一半 → 0.5 × 8 ≈ 4</li></ul><p>兩邊差不多，所以出風口更冷，可能只是同樣的冷量集中在更少的空氣裡。</p><p><b>數據也有這個跡象</b>：同一次實驗，出風口從 18.6 降到 14.9°C（降 3.7°C），巢穴只從 23.3 降到 22.2°C（降 1.1°C），而且 52% 那段跑了 23 分鐘，這 1°C 有一部分可能只是時間更長。</p><p><b>結論</b>：選風速要以<b>巢穴溫度</b>為準，不能只看出風口。下一步做檔位掃描時兩個都要記，找讓巢穴最冷的風速。</p><p class='plain'><b>白話：</b>兩台冷氣，一台風大吹 18°C，一台風小吹 15°C。風小那台的風更冷，但房間不一定更涼，因為吹進來的風少了。</p><p class='careful'><b>注意</b>：「風量剩一半」是假設，52% 占空比不等於一半風量，我們沒量過風量；粗算只用來說明道理，不要當成測量結果講。</p>"},
{c:"hard",q:"你的數據有多可靠？",a:"<p>老實說重複性有限：各批次室溫不同（24–28°C）；14.87°C 那組只測過一次；冷面 5–6°C 是手測沒記錄；P1 選型那組是舊固件。可靠的是「降速優於全速」這個結論，同一份 CSV 裡前後對比得出來。</p>"},
{c:"hard",q:"微重力下氣流和冷凝水完全不同，怎麼保證？",a:"<p>保證不了。沒有重力，熱空氣不會上升，水滴也不會往下流，我們在地面做的風路和網底到太空都要重新驗證。地面原型只解決溫控和監測；簡介裡的定向氣流、防漏飲水嘴是設計思路，不是已驗證的結果。</p>"},
{c:"hard",q:"TEC 那麼費電，整台設備用多少電？",a:"<p>12703 估算約 36 W（12 V × 3 A 額定值）。整機實際功耗沒測過，原本打算用 INA219 量電流，09-10 砍掉了。太空電源預算要到正式載荷階段才評估。</p>"},
{c:"hard",q:"開關式控溫溫度會上下擺，對動物有害嗎？",a:"<p>設計上巢穴會在目標 ±0.5°C 之間擺動，實際擺多少沒量化過，對動物的影響也沒研究。正式蟄眠實驗前要換回 PI 控溫，讓溫度更穩。</p>"},
/* ---- 發散 ---- */
{c:"extra",q:"你們用了動物嗎？",a:"<p><b>沒有</b>，全部是空箱測試。動物實驗需要倫理審批，不在本項目範圍。</p>"},
{c:"extra",q:"動物倫理的 3R 怎麼體現？",a:"<p>3R 是替代、減少、優化。減少：先用空箱把硬體調好，將來少用動物試錯。優化：紅外攝影不打擾夜間活動、雙層網把動物墊高不碰冷凝水、出事自動停機。</p><p class='careful'><b>注意</b>：封閉巢穴、紋理內壁按實物講，沒裝就說設計構想；LED 只能手動調光，不要說已有 12 小時晝夜循環。</p>"},
{c:"extra",q:"簡介裡的植入晶片是做什麼的？你們做了嗎？",a:"<p>那是未來完整實驗的方案：用 DSI 植入式無線晶片連續記錄動物核心體溫，要麻醉手術植入。我們現在沒做，也做不了。</p>"},
{c:"extra",q:"為什麼用 ESP32，不用 Arduino？為什麼用 DS18B20？",a:"<ul><li>ESP32：自帶 WiFi，一塊板就能控溫又開網頁；普通 Arduino Uno 沒有 WiFi，還要另加模組</li><li>DS18B20：數位輸出、一條線掛多顆、有現成防水探頭、解析度 0.0625°C</li><li>TEC1-12703：兩種都買來對比測過才選的</li></ul>"},
{c:"extra",q:"太空實驗為什麼喜歡用小型動物？",a:"<p>體型小、重量輕、吃得少，飛行設備容易做小；脂尾袋鼩成年只有 10–20 g。</p>"},

var QKEY="defense-quiz-v1";
var qpool=[], qi=0, qshow=false, qonly="all", qpart=0, qsize=8, qredo=false;
function scope(){return CARDS.filter(function(c){return qonly==="all"||c.c===qonly})}
function partCount(){return Math.max(1,Math.ceil(scope().length/qsize))}
function partCards(k){return scope().slice(k*qsize,(k+1)*qsize)}
function saveQuiz(){
  try{localStorage.setItem(QKEY,JSON.stringify({only:qonly,part:qpart,size:qsize,redo:qredo,pool:qpool.map(function(c){return c.id}),qi:qi}))}catch(e){}
}
function loadQuiz(){
  try{
    var s=JSON.parse(localStorage.getItem(QKEY)||"null"); if(!s)return false;
    qonly=s.only||"all";qsize=s.size||8;qpart=s.part||0;qredo=!!s.redo;
    if(qpart>=partCount())qpart=0;
    qpool=(s.pool||[]).map(function(id){return BYID[id]}).filter(Boolean);
    qi=Math.min(s.qi||0,qpool.length);qshow=false;
    return true;
  }catch(e){return false}
}
function buildPool(){
  qpool=partCards(qpart).filter(function(c){return qredo||!mastered[c.id]});
  for(var i=qpool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=qpool[i];qpool[i]=qpool[j];qpool[j]=t}
  qi=0;qshow=false;saveQuiz();
}
function rate(n){
  var c=qpool[qi]; if(!c)return;
  if(n===3){mastered[c.id]=1;save();progress()}
  else if(n===2){qpool.push(c)}
  else{qpool.splice(Math.min(qi+4,qpool.length),0,c)}
  qi++;qshow=false;saveQuiz();renderQuiz();
}

    return '<option value="'+k+'"'+(qonly===k?" selected":"")+'>'+CATS.filter(function(x){return x.id===k})[0].name+'</option>'}).join("");
  var parts="";
  for(var k=0;k<partCount();k++){
    var pc=partCards(k), d=pc.filter(function(c){return mastered[c.id]}).length;
    parts+='<option value="'+k+'"'+(qpart===k?" selected":"")+'>第 '+(k+1)+' 部分（'+d+'/'+pc.length+' 已掌握）</option>';
  }
  var sizes=[5,8,10,15].map(function(n){return '<option value="'+n+'"'+(qsize===n?" selected":"")+'>每部分 '+n+' 題</option>'}).join("");
  return '<div class="tools"><select id="sel" aria-label="題型" style="'+sel+'">'+opts+'</select>'
   +'<select id="part" aria-label="部分" style="'+sel+'">'+parts+'</select>'

}

     +'<button class="btn ghost" id="again">這部分再練一輪</button><button class="btn ghost" id="redo">連已掌握的也重練</button></div>';
    if(!last)document.getElementById("next").onclick=function(){qpart++;qredo=false;buildPool();renderQuiz()};
    document.getElementById("again").onclick=function(){qredo=false;buildPool();renderQuiz()};
    document.getElementById("redo").onclick=function(){qredo=true;buildPool();renderQuiz()};
    bindTools();
    return;
  }
  var c=qpool[qi];
  view.innerHTML='<p class="lead">每次練一個部分，只抽還沒掌握的題；做到哪裡會自動記住，下次打開接著做。先自己開口說一遍（30 秒內），再看答案。電腦上：空格看答案，1 / 2 / 3 評分。「不會」的題幾題後再出現。</p>'
   +quizTools()
   +'<div class="quiz"><div class="meta">'+TAGS[c.c]+' · 第 '+(qpart+1)+' 部分 · 第 '+(qi+1)+' / '+qpool.length+' 題</div><p class="q" id="qq"></p>'
   +(qshow?'<div class="ans">'+c.a+'</div><div class="row"><button class="btn bad" id="nope">不會<kbd>1</kbd></button><button class="btn ghost" id="fuzzy">模糊<kbd>2</kbd></button><button class="btn ok" id="got">記住了<kbd>3</kbd></button></div>'
          :'<div class="row"><button class="btn" id="show">看答案</button><button class="btn ghost" id="skip">跳過</button></div>')
   +'</div>';
  document.getElementById("qq").textContent=c.q;
  bindTools();
  if(qshow){
    document.getElementById("got").onclick=function(){rate(3)};
    document.getElementById("fuzzy").onclick=function(){rate(2)};
    document.getElementById("nope").onclick=function(){rate(1)};
  }else{
    document.getElementById("show").onclick=function(){qshow=true;renderQuiz()};
    document.getElementById("skip").onclick=function(){qi++;saveQuiz();renderQuiz()};
  }
}
var quizReady=false;
function render(){
  drawTabs();progress();
  if(cur==="cheat")view.innerHTML=cheat;
  else if(cur==="quiz"){
    if(!quizReady){quizReady=true;if(!loadQuiz())buildPool()}
    renderQuiz();
  }
  else renderList(cur);
}
render();
</script>
