; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 默认只构建主固件；单元测试请用 `pio test -e native` 显式指定环境
; （不设 default_envs 时 `pio run` 会连带构建 native，CI 必挂）
[platformio]
default_envs = esp32dev

[env:esp32dev]
; 锁定 7.1.3（Arduino core 2.0.17）：代码用的是 2.x 的 ledcSetup / esp_task_wdt_init(7, true)，
; 8.0.0 起换成 core 3.x 会编译失败
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    olikraus/U8g2@^2.34.22
    adafruit/Adafruit BME680 Library@^2.0.4

; ============================================================
; 单元测试环境（桌面 native，不烧录硬件）
; 详见 test/README_TESTS.md
; 运行：pio test -e native
; ============================================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -I test/mocks
    -I test
test_framework = unity
