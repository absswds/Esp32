; DFRobot DFR1154 ESP32-S3 AI Camera (16MB Flash + 8MB OPI PSRAM)
; Reliable short-request JPEG polling server

[env:esp32s3cam]
platform = espressif32
board = dfrobot_dfr1154
framework = arduino
monitor_speed = 115200

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  esp32-camera
