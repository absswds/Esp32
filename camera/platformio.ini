; DFRobot FireBeetle 2 ESP32-S3 AI Camera v1.1 (DFR1154: 16MB Flash + 8MB PSRAM)
; MJPEG streamer → joins ESP32-TEMP WiFi AP

[env:esp32s3cam]
platform = espressif32
board = dfrobot_dfr1154
board_build.arduino.ldscript = esp32s3_out.ld
framework = arduino
monitor_speed = 115200

; PSRAM required for camera frame buffers (defined in board JSON, but ensure flags)
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  esp32-camera
