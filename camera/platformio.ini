; DFRobot DFR1154 ESP32-S3 AI Camera (16MB Flash + 8MB OPI PSRAM)
; Reliable short-request JPEG polling server

[env:esp32s3cam]
; Pinned to the same platform as the main ESP (Arduino core 2.0.17); 8.0.0 moves to core 3.x
platform = espressif32 @ 7.1.3
board = dfrobot_dfr1154
framework = arduino
monitor_speed = 115200

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  espressif/esp32-camera@2.0.4
