name: PlatformIO Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'platformio.ini'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'platformio.ini'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
